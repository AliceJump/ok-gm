[project]
name = "ok-gm"
version = "0.1.0"
description = "OK GM - Game Management Automation Tool"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ok-script[default,qt]==2.0.8",
    "onnxocr-ppocrv5==0.0.14",
    "playwright==1.57.0",
    "openvino==2026.0.0",
    "opencv-python==4.12.0.88",
    "pyautogui==0.9.54",
    "imagehash==4.3.2",
    "scikit-image==0.26.0",
    "pywin32>=306",
    "pycryptodome>=3.23,<4",
    "polib>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
